name: Apply one-off UI fixes

on:
  push:
    paths:
      - '.github/workflows/apply-ui-fixes.yml'

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_schedule = """schedule: `3 октября 2026.\n10.00 МСК / 14.00 НСК — встреча всех участников марафона. Подключаются дети и руководители команд.\n11.00 МСК / 15.00 НСК — отдельная встреча участников курса повышения квалификации.`,"""
          new_schedule = """schedule: `3 октября 2026.\nОриентировочное время:\n10.00 МСК / 14.00 НСК — встреча всех участников марафона. Подключаются дети и руководители команд.\n11.00 МСК / 15.00 НСК — отдельная встреча участников курса повышения квалификации.`,"""
          if old_schedule not in text:
              raise SystemExit('Expected meeting fallback not found')
          text = text.replace(old_schedule, new_schedule, 1)

          old_action = """  function actionForAssignment(assignment) {\n    if (assignment.status === 'accepted' && assignment.answerUrl) {\n      return `<a class=\"tag\" href=\"${escapeHtml(assignment.answerUrl)}\" target=\"_blank\" rel=\"noopener noreferrer\">Открыть сданную работу</a>`;\n    }\n"""
          new_action = """  function actionForAssignment(assignment) {\n    if (assignment.status === 'accepted') return '';\n"""
          if old_action not in text:
              raise SystemExit('Expected accepted-work action not found')
          text = text.replace(old_action, new_action, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify
        shell: bash
        run: |
          grep -Fq 'Ориентировочное время:' index.html
          ! grep -Fq '>Открыть сданную работу</a>' index.html

      - name: Commit patch and remove one-off workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-ui-fixes.yml
          git config user.name 'chatgpt-site-fix'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine first meeting time and progress actions'
          git push origin HEAD:main
